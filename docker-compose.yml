version: '3'

services:
  comlink-dev:
    image: node:18-alpine
    container_name: comlink-dev
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "8082:8082"
    command: >
      sh -c "if [ ! -d 'develop/node_modules' ]; then
              cd develop && npm install && cd ..;
            fi &&
            cd develop && npm run dev"
    environment:
      - NODE_ENV=development

  comlink-build:
    image: node:18-alpine
    container_name: comlink-build
    working_dir: /app
    volumes:
      - ./:/app
    command: >
      sh -c "cd develop && npm install && npm run build"
    environment:
      - NODE_ENV=production

  comlink-docs:
    image: node:18-alpine
    container_name: comlink-docs
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "8083:8083"
    command: >
      sh -c "cd develop && npm install && npm run docs"
    environment:
      - NODE_ENV=development
